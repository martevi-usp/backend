[project]
name = "martevi"
version = "0.1.0"
description = "martevi backend — FastAPI service behind the museum-provider adapter"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.141",
  "pydantic>=2.13",
  # argostranslate itself is installed with --no-deps (see Dockerfile and
  # ADR-0005) because its declared deps pull in torch + CUDA; these are the
  # runtime deps it actually needs.
  "ctranslate2>=4.8",
  "sentencepiece>=0.2",
  "sacremoses>=0.1",
  "minisbd>=0.9",
  "packaging",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["martevi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
