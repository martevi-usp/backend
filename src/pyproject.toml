[project]
name = "martevi"
version = "0.1.0"
description = "martevi backend — FastAPI service behind the museum-provider adapter"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.141",
  "sqlalchemy>=2.0",
  "alembic>=1.19",
  "pydantic>=2.13",
  "deep-translator>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["martevi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
